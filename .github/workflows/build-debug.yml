name: Build APK

on:
  push:
    branches: [ feat/*, main, master, subagent-restricted-catalog ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Configure signing (secrets, or persistent CI keystore)
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          elif [ -f "signing/ci-release.keystore" ]; then
            echo "Using repository persistent CI keystore"
            echo "storeFile=$(pwd)/signing/ci-release.keystore" > local.properties
            echo "storePassword=ci_store_pass_9f3k" >> local.properties
            echo "keyAlias=cikey" >> local.properties
            echo "keyPassword=ci_store_pass_9f3k" >> local.properties
          else
            echo "No keystore secrets or repo keystore - generating throwaway CI keystore"
            keytool -genkeypair -v -keystore /tmp/ci-release.keystore -alias cikey -keyalg RSA -keysize 2048 -validity 10000 -storepass ci_store_pass_9f3k -keypass ci_store_pass_9f3k -dname "CN=CI Build, O=CI"
            echo "storeFile=/tmp/ci-release.keystore" > local.properties
            echo "storePassword=ci_store_pass_9f3k" >> local.properties
            echo "keyAlias=cikey" >> local.properties
            echo "keyPassword=ci_store_pass_9f3k" >> local.properties
          fi

      - name: Sync database reconciler with compiled Room schema
        run: |
          chmod +x gradlew
          ./gradlew :app:kspDebugKotlin
          python3 -c "
          import json, glob, os, re
          files = glob.glob('app/schemas/me.rerere.rikkahub.data.db.AppDatabase/*.json')
          if files:
              latest = max(files, key=lambda f: int(os.path.splitext(os.path.basename(f))[0]))
              with open(latest) as f:
                  d = json.load(f)['database']
              ver = d['version']
              h = d['identityHash']
              print(f'Syncing ImportedDatabaseReconciler: version {ver}, hash {h}')
              p = 'app/src/main/java/me/rerere/rikkahub/data/db/ImportedDatabaseReconciler.kt'
              with open(p, 'r') as f:
                  c = f.read()
              c = re.sub(r'EXPECTED_VERSION = \d+', f'EXPECTED_VERSION = {ver}', c)
              c = re.sub(r'EXPECTED_IDENTITY_HASH = \"[a-f0-9]+\"', f'EXPECTED_IDENTITY_HASH = \"{h}\"', c)
              with open(p, 'w') as f:
                  f.write(c)
          "

      - name: Run Unit Tests & Build Release APKs
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-universal-release
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-x86_64-release
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Retain only 7 most recent successful workflow runs and eliminate failed runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Eliminating all failed workflow runs..."
          FAILED_RUN_IDS=$(gh run list --repo "${{ github.repository }}" --limit 100 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion != "success") | .databaseId')
          for RUN_ID in $FAILED_RUN_IDS; do
            echo "Deleting failed run $RUN_ID..."
            gh run delete "$RUN_ID" --repo "${{ github.repository }}" || true
          done

          echo "Pruning older successful runs to keep at most 7..."
          SUCCESS_RUN_IDS=$(gh run list --repo "${{ github.repository }}" --limit 100 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId')
          INDEX=0
          for RUN_ID in $SUCCESS_RUN_IDS; do
            INDEX=$((INDEX + 1))
            if [ "$INDEX" -gt 7 ]; then
              echo "Deleting old successful run $RUN_ID..."
              gh run delete "$RUN_ID" --repo "${{ github.repository }}" || true
            fi
          done
